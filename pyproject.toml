[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bioinf590-kan-mlp"
version = "0.1.0"
description = "Reproducible capacity-controlled KAN versus MLP study"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "scikit-learn>=1.3", "pandas>=2.0", "matplotlib>=3.7"]
[project.optional-dependencies]
test = ["pytest>=7"]
[project.scripts]
kan-mlp = "kan_mlp.study:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
