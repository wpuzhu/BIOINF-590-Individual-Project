[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "bioinf590-kan-mlp"
version = "0.1.0"
description = "Reproducible capacity-controlled KAN versus MLP study"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0", "matplotlib>=3.7"]
# torch is needed only for the v1 PyTorch pipeline (kan_mlp.study / models.py)
[project.optional-dependencies]
torch = ["torch>=2.2"]
test = ["pytest>=7"]
[project.scripts]
kan-mlp = "kan_mlp.study:main"
kan-mlp-v2 = "kan_mlp.run_v2:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
